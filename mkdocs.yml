site_name: Brooks Price Action 交易课程
site_description: Brooks Price Action 交易课程学习笔记
site_url: https://daigua.github.io/CookBook/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - 起步:
    - 01起步/01-terminology.md
    - 01起步/02-chart-basics.md
    - 01起步/04-my-setup.md
    - 01起步/06-personality-traits.md
    - 01起步/07-starting-out.md
  - 图表分析:
    - 02图表分析/08-candles-setups.md
    - 02图表分析/09-pullbacks-bar-counting.md
    - 02图表分析/10-pressure.md
    - 02图表分析/11-gaps.md
  - 市场周期:
    - 03市场周期/12-cycle.md
    - 03市场周期/13-always-in.md
    - 03市场周期/14-trends.md

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - admonition
  - codehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daigua/CookBook

docs_dir: docs
